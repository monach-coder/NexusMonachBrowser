name: Verify Windows build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore NexusMonach.sln
      - name: Verify repository and license hygiene
        shell: pwsh
        run: ./scripts/Test-LicenseBoundary.ps1
      - name: Verify local AI security boundary
        shell: pwsh
        run: ./scripts/Test-LocalAiBoundary.ps1
      - name: Verify secure network boundary
        shell: pwsh
        run: ./scripts/Test-SecureNetworkBoundary.ps1
      - name: Build
        run: dotnet build NexusMonach.sln --configuration Release --no-restore -warnaserror
      - name: Run security regression tests
        run: dotnet test tests/NexusMonach.Security.Tests/NexusMonach.Security.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal
      - name: Smoke-launch the real browser window
        shell: pwsh
        run: |
          $exe = Resolve-Path "src/NexusMonach/bin/Release/net8.0-windows/NexusMonach.Browser.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-self-test" -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw "Smoke run did not exit within 120 seconds."
          }
          if ($process.ExitCode -ne 0) {
            throw "Smoke run exited with code $($process.ExitCode)."
          }
          Write-Output "Smoke run initialized WebView2, opened the main window and exited cleanly."
      - name: Ensure runtime code has no external AI endpoints
        shell: pwsh
        run: |
          $hits = Get-ChildItem src/NexusMonach -Recurse -Include *.cs,*.js,*.mjs |
            Select-String -Pattern '11434|api\.openai\.com|api\.anthropic\.com|api\.github\.com/repos/ggml-org|huggingface\.co/.*/resolve'
          if ($hits) { $hits | Format-Table; throw 'External AI runtime endpoint found.' }
